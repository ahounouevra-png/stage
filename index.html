<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stage Labocéa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
        }

        h1 {
            margin-top: 30px;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Galerie */
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 20px;
        }

        .gallery img {
            width: 280px;
            height: auto;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
        }

        .close, .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            color: white;
            cursor: pointer;
            user-select: none;
        }

        .close {
            top: 20px;
            right: 40px;
            font-size: 50px;
        }

        .prev {
            left: 40px;
        }

        .next {
            right: 40px;
        }
    </style>
</head>

<body>

    <h1>Stage Labocéa</h1>
    <p>Diaporama de supervision :</p>

    <div class="gallery">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0001.jpg" onclick="openLightbox(0)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0002.jpg" onclick="openLightbox(1)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0003.jpg" onclick="openLightbox(2)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0004.jpg" onclick="openLightbox(3)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0005.jpg" onclick="openLightbox(4)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0006.jpg" onclick="openLightbox(5)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0007.jpg" onclick="openLightbox(6)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0008.jpg" onclick="openLightbox(7)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0009.jpg" onclick="openLightbox(8)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0010.jpg" onclick="openLightbox(9)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0011.jpg" onclick="openLightbox(10)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0012.jpg" onclick="openLightbox(11)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0013.jpg" onclick="openLightbox(12)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0014.jpg" onclick="openLightbox(13)">
        <img src="images/Labocea_Supervision_Diaporama.pptx_page-0015.jpg" onclick="openLightbox(14)">
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="close" onclick="closeLightbox()">×</span>
        <span class="prev" onclick="changeImage(-1)">❮</span>
        <img id="lightbox-img">
        <span class="next" onclick="changeImage(1)">❯</span>
    </div>

    <script>
        const images = [
            "images/Labocea_Supervision_Diaporama.pptx_page-0001.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0002.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0003.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0004.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0005.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0006.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0007.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0008.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0009.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0010.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0011.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0012.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0013.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0014.jpg",
            "images/Labocea_Supervision_Diaporama.pptx_page-0015.jpg"
        ];

        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            document.getElementById("lightbox-img").src = images[index];
            document.getElementById("lightbox").style.display = "flex";
        }

        function closeLightbox() {
            document.getElementById("lightbox").style.display = "none";
        }

        function changeImage(direction) {
            currentIndex = (currentIndex + direction + images.length) % images.length;
            document.getElementById("lightbox-img").src = images[currentIndex];
        }
    </script>

</body>
</html>
